<body style="margin:0;background:#000">
<video id="v" muted autoplay playsinline style="width:640px;height:360px"></video>
<script src="/dash.all.min.js"></script>
<script>
// Faux direct type Prime Video / M6+ : DASH, lecteur dash.js.
const q = new URLSearchParams(location.search), v = document.getElementById('v');
const player = dashjs.MediaPlayer().create();
player.updateSettings({ debug: { logLevel: +(q.get('log') || 0) }, streaming: { delay: { liveDelay: +(q.get('lat') || 6) }, liveCatchup: { enabled: false } } });
