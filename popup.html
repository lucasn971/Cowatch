<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
body{width:280px;margin:0;padding:14px;font:14px system-ui,sans-serif;background:#0f0e13;color:#f2eff6}
label{display:block;font-size:12px;color:#9b95a8;margin:8px 0 3px}
input{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #2c2934;background:#1a1820;color:#f2eff6}
button{margin-top:12px;width:100%;padding:9px;border:0;border-radius:8px;background:#ff5a3c;color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid #2c2934;color:#f2eff6}
#st{margin-top:10px;font-size:12px;color:#9b95a8}
</style></head><body>
<strong>Synchroniser cet onglet</strong>
<label>Serveur</label><input id="server" placeholder="https://salon-coche-private.onrender.com">
<label>Code du salon</label><input id="room" placeholder="ex. SHORE-42">
<label>Pseudo (le même que dans le salon)</label><input id="name">
<button id="join">Rejoindre</button>
<button id="leave" class="ghost">Quitter</button>
<div id="st"></div>
<script src="popup.js"></script>
</body></html>
