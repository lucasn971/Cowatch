<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cowatch</title>
<link rel="stylesheet" href="panel.css">
<link id="gfont" rel="stylesheet" href="">
</head>
<body>
<!-- Structure unique pour toutes les ambiances (passation Design du 22/10) : seuls les tokens --cw-* changent. -->
<header>
  <span class="logo">Cowatch</span>
  <span class="status small" id="playerStatus">Aucune vidéo détectée</span>
  <button class="icon hidden" id="foldBtn" aria-label="Replier le panneau" title="Replier le panneau (la vidéo prend toute la place)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
  <button class="icon" id="menuBtn" aria-label="Plus d'options" aria-haspopup="true" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</header>
<div id="menu" class="menu hidden" role="menu">
  <div class="menu-code small">Code du salon <b id="code"></b></div>
  <button role="menuitem" id="mTheme">Changer d'ambiance</button>
  <button role="menuitem" id="mCalib">Calage manuel (TV)</button>
  <button role="menuitem" id="photoBtn">Ajouter ma photo</button>
  <button role="menuitem" id="photoDel" class="hidden">Retirer ma photo</button>
  <button role="menuitem" id="diag">Diagnostic</button>
  <button role="menuitem" id="leave">Quitter le salon</button>
</div>
<input type="file" id="photoIn" accept="image/*" class="hidden">
<textarea id="diagOut" class="hidden" readonly></textarea>

<!-- Accueil -->
<section id="home">
  <label for="name">Ton pseudo</label>
  <div class="me-photo"><span class="avatar" id="myAvatar"></span><input id="name" maxlength="24" placeholder="ex. Lucas"></div>
  <button id="create" class="primary">Créer un salon</button>
  <label for="codeIn">Ou colle le lien d'invitation reçu</label>
  <div class="row"><input id="codeIn" maxlength="400" placeholder="Lien d'invitation"><button class="ghost" id="joinBtn">Rejoindre</button></div>
  <div id="err" class="small err" role="alert"></div>
</section>

<!-- Ce soir, quelle ambiance ? -->
<section id="choice" class="hidden">
  <h1>Ce soir, quelle ambiance&nbsp;?</h1>
  <div id="cards" class="cards" role="radiogroup" aria-label="Ambiances"></div>
  <div class="choice-foot"><span class="sr">Choix&nbsp;: <b id="pickedName"></b></span><button id="go" class="primary">C'est parti</button></div>
  <button id="choiceBack" class="link small">Retour</button>
</section>

<!-- Salon -->
<div id="room" class="hidden">
  <div id="invBar" class="block goal hidden"><span class="small">Invitation au salon <b id="invCode"></b></span><button id="invGo" class="ghost small">Rejoindre</button></div>
  <div class="now">
    <span id="nowTitle" class="now-title"></span>
    <span id="synced" class="synced small"><span class="dot"></span><span id="syncedTxt">calés</span></span>
  </div>
  <div class="group">
    <div class="group-head"><span class="kicker" id="groupTitle">Le groupe</span><button id="invite" class="invite">Convoquer un pote</button></div>
    <div id="peers"></div>
  </div>
  <div id="micHelp" class="small warn hidden"></div>

  <!-- Bloc propre à l'ambiance : Vestiaire = prono d'avant-match -->
  <div id="prono" class="prono hidden">
    <div id="pronoEdit" class="prono-edit">
      <span class="kicker">Ton prono</span>
      <input id="pH" type="number" min="0" max="20" inputmode="numeric" placeholder="0" aria-label="Buts de l'équipe à domicile">
      <span class="dash">-</span>
      <input id="pA" type="number" min="0" max="20" inputmode="numeric" placeholder="0" aria-label="Buts de l'équipe à l'extérieur">
      <button id="pGo" class="ghost small">OK</button>
    </div>
    <button id="pronoDone" class="prono-done hidden" aria-label="Modifier mon prono"><span class="kicker">Ton prono</span> <b id="pronoMine"></b> <span class="small muted">· modifier</span></button>
    <div id="pronoList" class="small muted"></div>
  </div>
  <div id="goalBar" class="block goal hidden"><span>Tu as crié <b>BUUUT</b></span><button id="goalCancel" class="ghost small">Annuler (VAR)</button></div>

  <div id="calib" class="block hidden">
    <div class="small" id="autoState"></div>
    <details id="manual">
      <summary class="small muted">Calage manuel (si quelqu'un regarde sur la TV)</summary>
      <div class="small muted">Tout le monde appuie sur TOP au moment où il <b>voit</b> le même instant.</div>
      <div class="row"><button class="ghost small" id="cStart">Lancer un TOP</button><button class="small hidden" id="align">Aligner</button></div>
      <button id="top" class="primary hidden">TOP !</button>
      <div id="cRes"></div>
      <div id="cMsg" class="small muted"></div>
    </details>
  </div>

  <div id="chat" aria-live="polite"></div>
  <div class="react" id="react"></div>
  <div class="compose">
    <label class="sr" for="chatIn">Message</label>
    <input id="chatIn" maxlength="500" placeholder="Crie un truc…">
    <button id="mute" class="icon mic" aria-label="Couper mon micro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="sr" id="muteTxt">Couper le micro</span></button>
  </div>
  <div id="net" class="small muted net"></div>
</div>
<script src="themes.js"></script>
<script src="panel.js"></script>
</body>
</html>
