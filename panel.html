<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cowatch</title>
<style>
:root{--bg:#0f0e13;--panel:#17151d;--line:#2a2731;--text:#f2eff6;--muted:#9b95a8;--accent:#ff5a3c;--ok:#3ccf98;--speak:#ffd23c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#121117;color:var(--text);font:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
section{padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hidden{display:none!important}
#home{display:flex;flex-direction:column;gap:6px}
#room{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.code{font:700 15px ui-monospace,monospace;letter-spacing:2px}
.peers{display:flex;flex-wrap:wrap;gap:6px}
.peer{border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.peer .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.peer.on .d{background:var(--ok)}
.peer.speaking{border-color:var(--speak)}
.react{display:flex;gap:4px;flex-wrap:wrap}
.react button{background:#121117;border:1px solid var(--line);font-size:17px;padding:4px 8px;border-radius:8px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:6px;font-size:12px}
.tabs button.on{border-color:var(--accent)}
#calib{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
#top{font-size:20px;padding:12px}
.res{display:flex;justify-content:space-between;font-size:12px}
#chat{flex:1;min-height:80px;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.msg{font-size:13px;word-wrap:break-word}
.msg b{margin-right:4px}
.msg .t{color:var(--muted);font-size:10.5px;margin-right:4px}
.sys{color:var(--muted);font-size:12px;font-style:italic}
.compose{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="logo">Cowatch<span>.</span></div>
  <div class="status" id="playerStatus">Aucune vidéo détectée</div>
</header>

<section id="home">
  <div class="muted small">Ouvre ton programme sur Canal+, Paramount+ ou TF1+, puis crée un salon et envoie le lien à tes amis.</div>
  <label for="name">Ton pseudo</label>
  <input id="name" maxlength="24" placeholder="ex. Lucas">
  <button id="create" style="margin-top:10px">Créer un salon</button>
  <label for="codeIn">Ou rejoindre avec un code</label>
  <div class="row"><input id="codeIn" maxlength="24" placeholder="ex. K7PQ2" style="flex:1"><button class="ghost" id="joinBtn">Rejoindre</button></div>
  <div id="err" class="small" style="color:var(--accent);min-height:18px"></div>
</section>

<div id="room" class="hidden">
  <div class="bar">
    <div class="row" style="justify-content:space-between">
      <div><span class="muted small">Salon </span><span class="code" id="code"></span></div>
      <button class="ghost small" id="invite">Copier l'invitation</button>
    </div>
    <div class="peers" id="peers"></div>
    <div class="row">
      <button id="mute" class="ghost small">Couper le micro</button>
      <label class="row small" style="margin:0;color:var(--text)"><input type="checkbox" id="ptt" style="width:auto"> Appuyer pour parler</label>
      <button id="micFix" class="small hidden">Autoriser le micro</button>
    </div>
    <div class="react" id="react"></div>
    <div class="tabs">
      <button class="ghost" id="mVod">Série / film</button>
      <button class="ghost" id="mLive">Match en direct</button>
    </div>
    <div id="calib" class="hidden">
      <div class="small muted">Tout le monde appuie sur TOP au moment où il <b>voit</b> le même instant (coup de sifflet, score qui change). Ceux qui sont en avance se mettent en pause.</div>
      <div class="row"><button class="ghost small" id="cStart">Lancer une calibration</button><button class="small hidden" id="align">Aligner</button></div>
      <button id="top" class="hidden">TOP !</button>
      <div id="cRes"></div>
      <div id="cMsg" class="small muted"></div>
    </div>
  </div>
  <div id="chat" aria-live="polite"></div>
  <div class="compose">
    <input id="chatIn" maxlength="500" placeholder="Écrire un message…">
    <button id="send">Envoyer</button>
  </div>
  <div style="padding:0 14px 12px"><button class="ghost small" id="leave">Quitter le salon</button></div>
</div>
<script src="panel.js"></script>
</body>
</html>
