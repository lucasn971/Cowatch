<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout : une carte de question centrée, une seule question à l'écran, barre de progression en haut. Deux univers : "anime" (encre et trames, sombre) et "tele" (villa au coucher de soleil, clair). */
:root{
  --bg:#0F1016; --surface:#1A1C25; --surface-2:#232633; --fg:#F3F3F6; --muted:#A3A6B8;
  --accent:#FF3D6E; --accent-2:#FFD23F; --on-accent:#14060B; --line:#2E3140;
  --dot:rgba(255,255,255,.06);
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-track="tele"]{
  --bg:#FFF3EC; --surface:#FFFFFF; --surface-2:#FFE4D6; --fg:#2B1020; --muted:#7D5A69;
  --accent:#F0306F; --accent-2:#FF8A1F; --on-accent:#FFFFFF; --line:#F4CDBD;
  --dot:rgba(240,48,111,.07);
  --display:"Shrikhand",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:14px 14px;
}
:root[data-track="tele"] body{
  background-image:radial-gradient(120% 60% at 50% -10%, #FFC7A8 0%, transparent 60%), radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size:auto, 14px 14px;
}
.wrap{
  min-height:100%; display:flex; flex-direction:column; gap:20px;
  max-width:560px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 28px;
}
.top{display:flex; align-items:center; gap:12px}
.brand{font-family:var(--display); font-size:15px; letter-spacing:.02em}
.brand b{color:var(--accent); font-weight:inherit}
.bar{flex:1; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:99px; transition:width .35s ease}
.count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:3.2em; text-align:right}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:22px 20px; display:flex; flex-direction:column; gap:16px;
  box-shadow:0 10px 30px -18px rgba(0,0,0,.45);
}
:root[data-track="anime"] .card{box-shadow:6px 6px 0 0 var(--accent)}
.kicker{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
h1,h2{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; line-height:1.15}
h1{font-size:clamp(28px,7vw,38px)}
h2{font-size:clamp(21px,5.4vw,26px)}
.quip{margin:0; color:var(--muted); font-size:15px}
.opts{display:grid; gap:10px}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{
  font:inherit; color:var(--fg); text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:12px; min-width:0;
  background:var(--surface-2); border:2px solid transparent; border-radius:14px; padding:13px 14px;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.opt:hover{border-color:var(--line)}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent-2); outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--surface-2))}
.opt .ic{font-size:22px; line-height:1; flex:none}
.opt .tx{display:flex; flex-direction:column; min-width:0}
.opt .tx b{font-weight:700}
.opt .tx small{color:var(--muted); font-size:13px}
.scale{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
.scale .opt{flex-direction:column; justify-content:center; padding:12px 4px; text-align:center; gap:6px}
.scale .opt .ic{font-size:28px}
.scale-legend{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:800; cursor:pointer; border:0; border-radius:14px; padding:14px 20px;
  background:var(--accent); color:var(--on-accent);
}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--muted); font-weight:600; padding:14px 6px}
.btn.wide{flex:1}
.hint{font-size:13px; color:var(--muted)}
.pitch{
  border-radius:16px; padding:16px; background:var(--surface-2); display:grid; gap:10px;
}
.pitch ul{margin:0; padding-left:1.1em; display:grid; gap:6px}
input[type="email"]{
  font:inherit; width:100%; padding:14px; border-radius:14px; border:2px solid var(--line);
  background:var(--surface-2); color:var(--fg);
}
.profile{font-family:var(--display); font-size:clamp(26px,7vw,34px); color:var(--accent); line-height:1.15; margin:0}
.note{font-size:13px; color:var(--muted)}
.check{display:flex; align-items:center; gap:10px; margin:14px 0 4px; font-size:15px; cursor:pointer}
.check input{width:22px; height:22px; accent-color:var(--accent); flex:none; margin:0}
.foot{margin-top:auto; text-align:center; font-size:12px; color:var(--muted)}
.fade{animation:in .28s ease both}
@keyframes in{from{opacity:.001; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
@media (max-width:380px){.opts.grid2{grid-template-columns:1fr}}
</style>

     title:"Tu es…", quip:"Pour savoir à qui on parle. Tu peux passer.",
     options:[
      {v:"femme", t:"Une femme"},
      {v:"homme", t:"Un homme"},
      {v:"autre", t:"Autre"},
      {v:"nsp", t:"Je préfère ne pas dire"}
     ], grid:true},
    {id:"age", type:"single", kicker:"Dernière ligne droite",
     title:"T'as quel âge ?", quip:"Juste une tranche. On n'est pas l'état civil.",
     options:[
      {v:"16_17", t:"16-17"},
      {v:"18_24", t:"18-24"},
      {v:"25_34", t:"25-34"},
      {v:"35_plus", t:"35 et plus"}
     ], grid:true},
    {id:"email", type:"email"}
  ]
}[TRACK];

const INTRO = TRACK === "anime" ? {
  kicker:"Sondage express · 2 minutes",
  title:"Tes animés, tes potes, le même épisode.",
  text:"Une quinzaine de clics pour nous dire comment tu regardes tes animés. Pas de nom, pas de compte, pas de filler arc.",
  cta:"C'est parti"
} : {
  kicker:"Sondage express · 2 minutes",
  title:"Ta télé-réalité, tes copines, le même épisode.",
  text:"Une douzaine de clics pour nous dire comment tu suis tes émissions. Pas de nom, pas de compte, pas d'élimination.",
  cta:"J'ouvre l'enveloppe"
};

const SRC = (new URLSearchParams(location.search).get("src") || "direct").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 30) || "direct";
const state = {i:-1, answers:{}, started:Date.now(), saved:null};
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const count = document.getElementById("count");
const total = Q.length;

function el(tag, attrs={}, kids=[]){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function progress(){
  const done = Math.max(0, state.i);
  bar.style.width = (state.i >= total ? 100 : (done / total) * 100) + "%";
  count.textContent = state.i < 0 ? "" : state.i >= total ? "fini" : (state.i + 1) + "/" + total;
}

function optButton(o, pressed, onClick){
  const kids = [];
  if (o.ic) kids.push(el("span",{class:"ic","aria-hidden":"true",text:o.ic}));
  const tx = el("span",{class:"tx"},[el("b",{text:o.t ?? String(o.v)})]);
  if (o.s) tx.append(el("small",{text:o.s}));
  if (o.t || o.s) kids.push(tx);
  return el("button",{type:"button",class:"opt","aria-pressed":pressed?"true":"false",onclick:onClick},kids);
}

function head(q){
  const kids = [];
  if (q.kicker) kids.push(el("div",{class:"kicker",text:q.kicker}));
  kids.push(el("h2",{text:q.title}));
  if (q.quip) kids.push(el("p",{class:"quip",text:q.quip}));
  return kids;
}

function nav(canNext, onNext, label="Suivant"){
  const row = el("div",{class:"row"});
  if (state.i > 0) row.append(el("button",{type:"button",class:"btn ghost",text:"← Retour",onclick:()=>go(state.i-1)}));
  if (onNext) row.append(el("button",{type:"button",class:"btn wide",text:label,disabled:!canNext,onclick:onNext}));
  return row;
}

function renderIntro(){
  // Réservé aux 16 ans et plus (règle du 27/10) : la case doit être cochée pour commencer.
  const box = el("input",{type:"checkbox",id:"age16"});
  const start = el("button",{type:"button",class:"btn wide",id:"start",text:INTRO.cta,disabled:true,onclick:()=>{ state.answers.age_ok = "oui"; go(0); }});
  box.addEventListener("change", ()=>{ start.disabled = !box.checked; });
  const age16 = el("label",{class:"check",for:"age16"},[box, el("span",{text:"J'ai 16 ans ou plus"})]);
  app.replaceChildren(el("section",{class:"card fade"},[
    el("div",{class:"kicker",text:INTRO.kicker}),
    el("h1",{text:INTRO.title}),
    el("p",{class:"quip",text:INTRO.text}),
    age16,
    el("div",{class:"row"},[start])
  ]));
}

function renderQ(q){
  const card = el("section",{class:"card fade"});
  if (q.type === "single"){
    const cur = state.answers[q.id];
    const opts = el("div",{class:"opts"+(q.grid?" grid2":"")});
    q.options.forEach(o => opts.append(optButton(o, cur === o.v, () => {
      state.answers[q.id] = o.v; renderQ(q); setTimeout(()=>go(state.i+1), 220);
    })));
    card.append(...head(q), opts, nav(cur != null, cur != null ? ()=>go(state.i+1) : null));
    if (cur == null) card.lastChild.append(el("span",{class:"hint",text:"Un clic et on avance."}));
  } else if (q.type === "multi"){
    const cur = state.answers[q.id] || [];
    const opts = el("div",{class:"opts"+(q.grid?" grid2":"")});
    q.options.forEach(o => opts.append(optButton(o, cur.includes(o.v), () => {
      let next = cur.includes(o.v) ? cur.filter(x=>x!==o.v) : cur.concat(o.v);
      if (q.max && next.length > q.max) next = next.slice(next.length - q.max);
      state.answers[q.id] = next; renderQ(q);
    })));
    const hint = q.max ? `${cur.length}/${q.max} choisis` : (cur.length ? `${cur.length} choisi${cur.length>1?"s":""}` : "Choisis au moins une réponse");
    card.append(...head(q), opts, el("div",{class:"hint",text:hint}), nav(cur.length>0, ()=>go(state.i+1)));
  } else if (q.type === "scale"){
    const cur = state.answers[q.id];
    const opts = el("div",{class:"scale"});
    q.options.forEach(o => {
      const b = optButton({ic:o.ic, t:String(o.v)}, cur === o.v, () => {
        state.answers[q.id] = o.v; renderQ(q); setTimeout(()=>go(state.i+1), 220);
      });
      b.setAttribute("aria-label", `${o.v} sur 5`);
      opts.append(b);
    });
    card.append(...head(q), opts, el("div",{class:"scale-legend"},[el("span",{text:q.left}),el("span",{text:q.right})]), nav(cur!=null, cur!=null?()=>go(state.i+1):null));
  } else if (q.type === "pitch"){
    card.append(
      el("div",{class:"kicker",text:"Le concept"}),
      el("h2",{text:PITCH.head}),
      el("div",{class:"pitch"},[el("ul",{},PITCH.items.map(t=>el("li",{text:t})))]),
      nav(true, ()=>go(state.i+1), "Je vois le truc")
    );
  } else if (q.type === "email"){
    const minor = state.answers.age === "moins_16";
    if (minor){
      card.append(
        el("div",{class:"kicker",text:"Terminé"}),
        el("h2",{text:"C'est tout bon."}),
        el("p",{class:"quip",text:"Merci, tes réponses comptent vraiment pour nous."}),
        nav(true, finish, "Envoyer mes réponses")
      );
    } else {
      const input = el("input",{type:"email",id:"email",placeholder:"ton@email.fr",autocomplete:"email",value:state.answers.email||""});
      input.addEventListener("input", ()=>{ state.answers.email = input.value.trim(); });
      const tbox = el("input",{type:"checkbox",id:"tester",checked:state.answers.tester === "oui"});
      tbox.addEventListener("change", ()=>{ if (tbox.checked) state.answers.tester = "oui"; else delete state.answers.tester; });
      const tester = el("label",{class:"check",for:"tester"},[tbox, el("span",{text:"Je veux tester Cowatch"})]);
      card.append(
        el("div",{class:"kicker",text:"Bonus facultatif"}),
        el("h2",{text:"Tu veux tester Cowatch en avant-première ?"}),
        el("p",{class:"quip",text:"Laisse ton mail et on t'envoie l'accès dès que c'est prêt. Sinon, laisse vide, zéro rancune."}),
        tester,
        input,
        nav(true, ()=>{
          const v = (state.answers.email||"").trim();
          if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ input.setCustomValidity("Adresse invalide"); input.reportValidity(); return; }
          finish();
        }, "Envoyer mes réponses")
      );
    }
  }
  app.replaceChildren(card);
}

function go(i){
  state.i = Math.max(0, Math.min(i, total-1));
  progress();
  renderQ(Q[state.i]);
  const first = app.querySelector(".opt,.btn.wide,input");
  if (first) first.focus({preventScroll:true});
  window.scrollTo({top:0});
}

function profile(){
  const a = state.answers;
  if (TRACK === "anime"){
    if (a.rythme === "jour_meme" && (a.pendant||[]).some(x=>["messages","vocal","countdown"].includes(x))) return ["Capitaine de l'équipage","Le jour de la sortie, ta team est sur le pont. Cowatch est fait pour toi."];
    if (a.rythme === "binge") return ["Moine du binge","Tu attends, tu stockes, tu enchaînes. Une séance marathon entre potes, ça te tente ?"];
    if (a.avec_qui === "seul") return ["Ronin solitaire","Tu regardes seul·e, mais tu racontes tout après. Et si ta team était là pendant ?"];
    return ["Nakama du canapé","Les animés, c'est meilleur à plusieurs. On est d'accord."];
  } else {
    if (a.role === "analyste") return ["Stratège de la villa","Tu avais tout vu venir. Il te faut un public pour tes analyses en direct."];
    if (a.role === "commentatrice") return ["Voix off officielle","Ton groupe WhatsApp n'est pas assez grand pour tes commentaires."];
    if (a.role === "emotive") return ["Cœur brisé de la saison","Chaque élimination te touche. Au moins, ne pleure plus seule."];
    if (a.role === "spoileuse") return ["Agent double","Spoileuse malgré toi. Avec Cowatch, tout le monde voit la scène en même temps."];
    return ["Reine du canapé","La télé-réalité, c'est meilleur à plusieurs. On est d'accord."];
  }
}

async function save(){
  const doc = {
    track: TRACK, v: 2, src: SRC, answers: {...state.answers},
    duree_s: Math.round((Date.now() - state.started) / 1000)
  };
  if (doc.answers.age === "moins_16") delete doc.answers.email;
  for (let essai = 0; essai < 3; essai++){
    try{
      const r = await fetch("/api/sondage", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(doc)});
      if (r.ok) return true;
    }catch(e){}
    await new Promise(ok => setTimeout(ok, 1500 * (essai + 1)));
  }
  return false;
}

async function finish(){
  state.i = total; progress();
  const [name, line] = profile();
  const status = el("p",{class:"note",text:"Enregistrement…"});
  const shareBtn = el("button",{type:"button",class:"btn wide",text:"Copier le lien pour ta team"});
  shareBtn.addEventListener("click", async ()=>{
    const url = location.origin + location.pathname + "?src=" + encodeURIComponent((SRC.replace(/-partage$/, "") + "-partage").slice(0, 30)); // un partage garde la trace de sa source
    try{ await navigator.clipboard.writeText(url); shareBtn.textContent = "Lien copié"; }
    catch(e){ shareBtn.textContent = url; }
  });
  app.replaceChildren(el("section",{class:"card fade"},[
    el("div",{class:"kicker",text:"Ton profil Cowatch"}),
    el("p",{class:"profile",text:name}),
    el("p",{class:"quip",text:line}),
    el("p",{class:"quip",text:"Merci ! Fais tourner à ta team : plus on a de réponses, plus vite Cowatch arrive."}),
    el("div",{class:"row"},[shareBtn]),
    status
  ]));
  const ok = await save();
  status.textContent = ok ? "Réponses enregistrées. Merci !" : "Oups, l'envoi a échoué. Vérifie ta connexion et réessaie dans un instant.";
}

renderIntro(); progress();
</script>

</body>
</html>
